[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operational-quality-skills"
version = "0.1.0"
description = "Operational quality monitoring and evidence-led root-cause investigation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
integrations = ["datadog-api-client>=2.30,<3", "psycopg[binary]>=3.2,<4"]
local-model = ["ollama>=0.4,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
ops-rca = "operational_quality.cli:main"
ops-rca-review = "operational_quality.cli:review_main"
ops-monitor = "operational_quality.monitor_cli:main"
ops-control-validate = "operational_quality.control_cli:main"
ops-conformance = "operational_quality.conformance_cli:main"
ops-control-coverage = "operational_quality.coverage_cli:main"
ops-improvement = "operational_quality.improvement_cli:main"
ops-referral-packets = "operational_quality.referral_cli:main"
ops-store-handoffs = "operational_quality.store_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
license-files = ["LICENSE", "third_party/*LICENSE"]

[tool.setuptools.data-files]
"share/operational-quality-skills/skills/operations-root-cause" = ["skills/operations-root-cause/SKILL.md"]
"share/operational-quality-skills/skills/operations-root-cause/agents" = ["skills/operations-root-cause/agents/openai.yaml"]
"share/operational-quality-skills/skills/operations-root-cause/references" = ["skills/operations-root-cause/references/*.md"]

"share/operational-quality-skills/skills/operational-quality-monitor" = ["skills/operational-quality-monitor/SKILL.md"]
"share/operational-quality-skills/skills/operational-quality-monitor/agents" = ["skills/operational-quality-monitor/agents/openai.yaml"]
